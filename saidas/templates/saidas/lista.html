<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registros de Saídas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #eee;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Registros de Saídas</h1>

    <table>

        <thead>
            <tr>
                <th>Nome</th>
                <th>Turma</th>
                <th>Motivo</th>
                <th>Data</th>
                <th>Horário</th>
            </tr>
        </thead>

        <tbody>

            {% for registro in registros %}

            <tr>
                <td>{{ registro.nome }}</td>
                <td>{{ registro.turma }}</td>
                <td>{{ registro.motivo }}</td>
                <td>{{ registro.data }}</td>
                <td>{{ registro.horario }}</td>
            </tr>

            {% empty %}

            <tr>
                <td colspan="5">
                    Nenhuma saída registrada.
                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

    <a href="/">
        ← Voltar para o cadastro
    </a>

</div>

</body>

</html>
