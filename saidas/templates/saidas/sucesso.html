{% load static %}

<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Smart Pass - Saída Registrada</title>
    <link rel="stylesheet" href="{% static 'saidas/style.css' %}">
</head>

<body>

<h1>SMART PASS</h1>
<h2>✅ Saída registrada com sucesso!</h2>

<hr>

<div class="card">


<h2>Dados do aluno</h2>

<p><strong>Nome:</strong> {{ aluno.nome }}</p>
<p><strong>Turma:</strong> {{ aluno.turma }}</p>
<p><strong>Matrícula:</strong> {{ aluno.matricula }}</p>
<p><strong>QR Code:</strong> {{ aluno.qr_code }}</p>


</div>

<br>

<a href="{% url 'registrar_saida' %}">
    Registrar outra saída
</a>

<a href="{% url 'inicio' %}">
    Voltar ao painel
</a>

</body>
</html>
